[project]
name = "fertilizer-genomics"
version = "0.1.0"
description = "Identify fertile ground in genomes for minimal-edit regulatory design."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jacob Schreiber" }]
keywords = ["bigwig", "chip-seq", "atac-seq", "enrichment", "deseq2", "genomics", "bioinformatics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pyBigWig>=0.3.22",
    "pandas>=2.0",
    "joblib>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
fertilizer = "fertilizer.cli:main"

[project.urls]
Homepage = "https://github.com/jmschrei/fertilizer"
Issues = "https://github.com/jmschrei/fertilizer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fertilizer"]
include = ["src/fertilizer/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
